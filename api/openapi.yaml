openapi: 3.0.3
info:
  title: KEDA Dashboard API
  version: 0.1.0
  description: Read-only API for observing KEDA autoscaling resources.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is healthy
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Kubernetes API is reachable
        "503":
          description: Kubernetes API is unavailable
  /api/v1/meta:
    get:
      operationId: getMeta
      responses:
        "200":
          description: Runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/v1/overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Cluster-wide KEDA summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /api/v1/events:
    get:
      operationId: streamUpdates
      responses:
        "200":
          description: Server-sent overview updates
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/{kind}:
    get:
      operationId: listResources
      parameters:
        - $ref: "#/components/parameters/Kind"
        - name: namespace
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          description: Filter by active, attention, ready, or paused state.
          schema:
            type: string
            enum: [active, attention, ready, paused]
      responses:
        "200":
          description: Filtered resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
  /api/v1/{kind}/{namespace}/{name}:
    get:
      operationId: getResource
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Enriched resource detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
  /api/v1/metrics/{kind}/{namespace}/{name}:
    get:
      operationId: getMetricHistory
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Name"
      responses:
        "200":
          description: Last-hour Prometheus samples, or an empty array when unavailable
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"
components:
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [scaledobjects, scaledjobs]
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
  schemas:
    Meta:
      type: object
      required: [kedaInstalled, prometheusEnabled, cluster, demoMode]
      properties:
        kedaInstalled: { type: boolean }
        kedaVersion: { type: string }
        prometheusEnabled: { type: boolean }
        cluster: { type: string }
        demoMode:
          type: boolean
          description: True when deterministic synthetic data is in use and Kubernetes access is disabled.
    Overview:
      type: object
      properties:
        scaledObjects: { type: integer }
        scaledJobs: { type: integer }
        ready: { type: integer }
        active: { type: integer }
        paused: { type: integer }
        unhealthy: { type: integer }
        triggerTypes:
          type: object
          additionalProperties: { type: integer }
        namespaces:
          type: array
          items: { type: string }
    ResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        total: { type: integer }
        namespaces:
          type: array
          items: { type: string }
    Resource:
      type: object
      required: [kind, apiVersion, namespace, name, paused, ready, active, currentReplicas, desiredReplicas, triggers, conditions]
      properties:
        kind: { type: string }
        apiVersion: { type: string }
        namespace: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        labels: { type: object, additionalProperties: { type: string } }
        paused: { type: boolean }
        ready: { type: boolean }
        active: { type: boolean }
        currentReplicas: { type: integer, format: int64 }
        desiredReplicas: { type: integer, format: int64 }
        target: { $ref: "#/components/schemas/RelatedResource" }
        hpa: { $ref: "#/components/schemas/RelatedResource" }
        triggers:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              healthy: { type: boolean }
              authenticationRef:
                $ref: "#/components/schemas/RelatedResource"
        conditions:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              status: { type: string }
              reason: { type: string }
              message: { type: string }
              lastTransitionTime: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              reason: { type: string }
              message: { type: string }
              count: { type: integer }
              timestamp: { type: string, format: date-time }
        yaml: { type: string, description: Redacted YAML; sensitive-looking fields are replaced and Secrets are never read. }
    RelatedResource:
      type: object
      properties:
        kind: { type: string }
        namespace: { type: string }
        name: { type: string }
        ready: { type: string }
    MetricPoint:
      type: object
      properties:
        timestamp: { type: integer, format: int64 }
        value: { type: number, format: double }
